<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Dimensions</h1>
    <p class="text-sm text-muted-foreground mt-1">
      Individual Q&amp;A is graded across these 4 fixed dimensions, each weighted by percent. Weights must add up to
      100.
    </p>
  </div>

  <app-card class="max-w-lg">
    <app-card-header>
      <app-card-title class="text-sm">Weights</app-card-title>
    </app-card-header>
    <app-card-content class="space-y-4">
      @for (d of dimensions(); track d.id) {
        <div class="flex items-center justify-between gap-3">
          <p class="text-sm">{{ d.label }}</p>
          <div class="flex items-center gap-1.5 shrink-0">
            <input
              appInput
              type="number"
              min="0"
              max="100"
              step="1"
              class="w-20 text-right"
              [value]="d.weightPercent"
              (input)="setWeight(d.id, $any($event.target).value)"
            />
            <span class="text-sm text-muted-foreground">%</span>
          </div>
        </div>
      }

      <div class="flex items-center justify-between border-t pt-3">
        <p class="text-sm" [class.text-destructive]="!totalValid()">Total: {{ totalWeight() }}%</p>
        <button appButton (click)="save()" [disabled]="saving() || !totalValid()">
          {{ saving() ? 'Saving…' : 'Save weights' }}
        </button>
      </div>
    </app-card-content>
  </app-card>
</div>
