<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Question bank</h1>
    <p class="text-sm text-muted-foreground mt-1">
      Edit the reviewer guidance and the question phrasings used when generating an individual Q&amp;A session for
      each rubric criterion.
    </p>
  </div>

  @if (reviewIds().length > 0) {
    <app-tabs [value]="reviewId()" (valueChange)="reviewId.set($event)">
      <app-tabs-list>
        @for (id of reviewIds(); track id) {
          <app-tabs-trigger [value]="id">{{ reviewLabels()[id] }}</app-tabs-trigger>
        }
      </app-tabs-list>
    </app-tabs>
  }

  <div class="space-y-4">
    @for (c of criteriaForReview(); track c.id) {
      <app-criterion-editor [criterion]="c" (update)="updateCriterionLocally(c.id, $event)" />
    }
  </div>
</div>
