<app-card>
  <app-card-header>
    <app-card-title class="text-sm font-normal leading-relaxed">
      <app-badge [variant]="badgeVariant()" class="mr-2 align-middle">{{ criterion().category }}</app-badge>
      {{ criterion().text }}
    </app-card-title>
  </app-card-header>
  <app-card-content class="space-y-4">
    <div>
      <p class="text-xs font-medium text-muted-foreground mb-1">Reviewer guidance</p>
      <textarea
        [value]="guidance()"
        (input)="guidance.set($any($event.target).value)"
        (blur)="saveGuidance()"
        rows="2"
        class="w-full text-sm border rounded-md px-3 py-2 bg-background"
        placeholder="What a strong answer covers…"
      ></textarea>
    </div>
    <div>
      <p class="text-xs font-medium text-muted-foreground mb-1.5">Question phrasings ({{ criterion().questions.length }})</p>
      <div class="space-y-1.5">
        @for (q of criterion().questions; track q.id) {
          <div class="flex items-start gap-1.5">
            <textarea
              [value]="q.text"
              (blur)="updateQuestion(q.id, $any($event.target).value)"
              rows="1"
              class="flex-1 text-sm border rounded-md px-3 py-1.5 bg-background resize-none"
            ></textarea>
            <button
              appButton
              variant="ghost"
              size="icon"
              class="size-8 shrink-0 text-muted-foreground hover:text-destructive"
              (click)="deleteQuestion(q.id)"
            >
              <svg lucideTrash2 class="size-3.5"></svg>
            </button>
          </div>
        }
      </div>
      <div class="flex items-center gap-1.5 mt-2">
        <input
          appInput
          [value]="newQuestion()"
          (input)="newQuestion.set($any($event.target).value)"
          (keydown.enter)="addQuestion()"
          placeholder="Add another phrasing of this question…"
          class="flex-1"
        />
        <button appButton variant="outline" size="sm" (click)="addQuestion()">
          <svg lucidePlus class="size-3.5"></svg> Add
        </button>
      </div>
    </div>
  </app-card-content>
</app-card>
