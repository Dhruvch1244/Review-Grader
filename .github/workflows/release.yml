name: Windows Release Build

on:
  push:
    branches: ["release"]
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows-zip:
    # Pinned rather than windows-latest: that label currently points at an
    # image bundling a newer Visual Studio release than the node-gyp
    # version shipped with Node 22 knows how to detect, which breaks
    # compiling better-sqlite3's native binary (node-gyp finds VS but logs
    # "unknown version \"undefined\"" and gives up). windows-2022 ships the
    # VS2022 toolchain node-gyp actually supports.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17 (compiles the launcher)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Read package version
        id: pkg
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies (whole workspace)
        run: npm ci

      - name: Build the API server and the Angular static bundle
        run: npm run build

      - name: Install the API's production dependencies only
        # npm workspaces hoist shared deps to the root node_modules (that's
        # where better-sqlite3's compiled Windows binary actually lands,
        # not apps/api/node_modules) - `npm ci --omit=dev` at the root,
        # scoped to just the api workspace, reinstalls only what
        # apps/api/dist needs to run, still respecting that hoisting.
        run: npm ci --omit=dev --workspace=@review-grader/api

      - name: Stage the app payload (goes inside the jar under app/)
        shell: pwsh
        run: |
          $stage = "stage/app"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item -Recurse -Force "apps/api/dist" "$stage/dist"

          New-Item -ItemType Directory -Force -Path "$stage/node_modules" | Out-Null
          Copy-Item -Recurse -Force "node_modules/*" "$stage/node_modules/"
          if (Test-Path "apps/api/node_modules") {
            Copy-Item -Recurse -Force "apps/api/node_modules/*" "$stage/node_modules/"
          }
          # npm workspaces add a self-referential symlink here
          # (node_modules/@review-grader/api -> ../../apps/api) that dangles
          # once copied out in isolation - nothing requires it at runtime.
          Remove-Item -Recurse -Force "$stage/node_modules/@review-grader" -ErrorAction SilentlyContinue

          # Built Angular static assets, served by Express from ./public
          # next to dist/server.js (see apps/api/src/app.ts).
          Copy-Item -Recurse -Force "apps/api/public" "$stage/public"

      - name: Verify better-sqlite3's native binary is staged
        shell: pwsh
        run: |
          $binary = "stage/app/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $binary)) {
            throw "better-sqlite3 native binary missing from the staged payload - Windows build did not compile or was not copied in."
          }
          Write-Host "Found $binary"

      - name: Download a portable Node.js runtime (latest v22.x) into the stage
        shell: pwsh
        run: |
          $index = Invoke-RestMethod -Uri "https://nodejs.org/dist/index.json"
          $latest22 = $index | Where-Object { $_.version -like "v22.*" } | Select-Object -First 1
          $nodeVersion = $latest22.version
          Write-Host "Bundling portable Node.js $nodeVersion"
          $url = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node-portable.zip
          Expand-Archive -Path node-portable.zip -DestinationPath node-extracted
          New-Item -ItemType Directory -Force -Path "stage/node" | Out-Null
          Copy-Item "node-extracted/node-$nodeVersion-win-x64/node.exe" "stage/node/node.exe"

      - name: Compile the launcher
        run: |
          mkdir classes
          javac --release 17 -d classes launcher/Main.java

      - name: Build the single runnable jar (launcher + bundled node + app, as jar entries)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          jar cfe release/review-grader.jar Main -C classes . -C stage .

      - name: Download a portable JRE 17 for start.bat to run the jar with
        shell: pwsh
        run: |
          $url = "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk"
          Invoke-WebRequest -Uri $url -OutFile jre-portable.zip
          Expand-Archive -Path jre-portable.zip -DestinationPath jre-extracted
          # Adoptium zips extract to one versioned top-level folder (e.g.
          # jdk-17.0.x+y-jre) - flatten whatever that's named into release/jre.
          $jreRoot = Get-ChildItem jre-extracted | Select-Object -First 1
          Copy-Item -Recurse -Force "$($jreRoot.FullName)" "release/jre"

      - name: Add the Windows launcher script
        shell: pwsh
        run: |
          Copy-Item scripts/windows/start.bat release/start.bat
          Copy-Item scripts/windows/README-WINDOWS.txt release/README-WINDOWS.txt

      - name: Zip it up
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath review-grader-windows.zip

      - name: Attach to the GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/release')
        uses: softprops/action-gh-release@v2
        with:
          # A manually-published Release already has its own tag - only
          # push-to-release-branch needs one derived from package.json.
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', steps.pkg.outputs.version) }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('Review Grader v{0}', steps.pkg.outputs.version) }}
          make_latest: true
          files: review-grader-windows.zip

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: review-grader-windows
          path: review-grader-windows.zip
